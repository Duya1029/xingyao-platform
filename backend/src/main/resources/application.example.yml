server:
  port: 8091

spring:
  application:
    name: xingyao-platform
  datasource:
    url: jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=xingyao;encrypt=true;trustServerCertificate=true
    username: your_db_user
    password: your_db_password
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

xingyao:
  jwt:
    # 至少 32 字节的随机字符串
    secret: change-this-to-a-random-secret-at-least-32-bytes
    expire-minutes: 720
  upload:
    dir: ./uploads
  captcha:
    enabled: true
